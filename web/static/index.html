<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Bomb</title>
  <!-- Two-door home (specs/002-host-local-game, T023). Self-contained styles:
       the same design tokens as the assistant and the game, by value. -->
  <style>
    :root {
      --ink: #1c2330; --paper: #f7f5f0; --card: #ffffff; --line: #d8d3c8;
      --accent: #b3462e; --muted: #6b7280;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e9e5dd; --paper: #191817; --card: #24221f; --line: #423e38;
        --accent: #d4644a; --muted: #9b958a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto; padding: 0 1rem 3rem; max-width: 40rem;
      font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.45;
      color: var(--ink); background: var(--paper);
    }
    header { padding-top: 2rem; }
    h1 { margin: 0; font-size: 1.7rem; }
    .tagline { margin: 0.3rem 0 0; color: var(--muted); }
    .doors { display: grid; gap: 1rem; margin-top: 1.6rem; }
    @media (min-width: 480px) { .doors { grid-template-columns: 1fr 1fr; } }
    a.door {
      display: block; padding: 1.2rem 1.1rem; border: 1px solid var(--line);
      border-radius: 12px; background: var(--card); color: inherit;
      text-decoration: none;
    }
    a.door:hover, a.door:focus-visible { border-color: var(--accent); outline: none; }
    .door h2 { margin: 0 0 0.35rem; font-size: 1.15rem; }
    .door p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    #continue-note { margin-top: 1rem; font-size: 0.92rem; color: var(--muted); }
    #continue-note a { color: var(--accent); }
    #saves { margin-top: 1.6rem; }
    #saves h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
    .save-row {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.2rem;
      border-bottom: 1px solid var(--line); font-size: 0.92rem;
    }
    .save-row .save-meta { flex: 1; min-width: 0; }
    .save-row .save-name { font-weight: 600; }
    .save-row .save-sub { color: var(--muted); font-size: 0.85rem; }
    .save-row button {
      font-size: 0.85rem; padding: 0.35rem 0.7rem; border: 1px solid var(--line);
      border-radius: 8px; background: var(--card); color: var(--ink); cursor: pointer;
    }
    .save-row button.resume { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Time Bomb</h1>
    <p class="tagline">Play the game, or bring the assistant to your real table.</p>
  </header>

  <main>
    <nav class="doors">
      <a class="door" href="/play">
        <h2>🕹️ Play</h2>
        <p>Host a full game here — hotseat friends, AI opponents, or both.</p>
      </a>
      <a class="door" href="/assistant/">
        <h2>🧮 Assistant</h2>
        <p>Calibrated probabilities for a physical game in progress — the numbers,
          never the call.</p>
      </a>
    </nav>
    <p id="continue-note" hidden>A game is in progress — <a href="/play">continue it</a>.</p>

    <!-- Named saves (specs/002 US6): resumable on this machine across restarts. -->
    <section id="saves" hidden>
      <h2>Saved games</h2>
      <div id="save-list"></div>
    </section>
  </main>

  <script>
    fetch("/api/game").then((resp) => {
      if (resp.ok) document.getElementById("continue-note").hidden = false;
    }).catch(() => {});

    function renderSaves(saves) {
      const box = document.getElementById("saves");
      const list = document.getElementById("save-list");
      list.replaceChildren();
      box.hidden = saves.length === 0;
      for (const save of saves) {
        const row = document.createElement("div");
        row.className = "save-row";
        const meta = document.createElement("div");
        meta.className = "save-meta";
        const name = document.createElement("div");
        name.className = "save-name";
        name.textContent = save.name;
        const sub = document.createElement("div");
        sub.className = "save-sub";
        const when = (save.created || "").replace("T", " ");
        sub.textContent = `${save.seats.join(", ")} — ` +
          (save.phase === "finished" ? "finished (opens in replay)" : "in progress") +
          (when ? ` — ${when}` : "");
        meta.append(name, sub);

        const resume = document.createElement("button");
        resume.className = "resume";
        resume.textContent = "Resume";
        resume.addEventListener("click", async () => {
          const resp = await fetch(`/api/saves/${encodeURIComponent(save.name)}/resume`,
                                   { method: "POST" });
          if (resp.ok) { location.href = "/play"; return; }
          const body = await resp.json().catch(() => null);
          alert((body && body.error) || `Resume failed (${resp.status})`);
        });

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.addEventListener("click", async () => {
          if (!confirm(`Delete the save “${save.name}”? This cannot be undone.`)) return;
          await fetch(`/api/saves/${encodeURIComponent(save.name)}`, { method: "DELETE" });
          loadSaves();
        });

        row.append(meta, resume, del);
        list.append(row);
      }
    }

    function loadSaves() {
      fetch("/api/saves").then((r) => r.json()).then(renderSaves).catch(() => {});
    }
    loadSaves();
  </script>
</body>
</html>
