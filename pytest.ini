[pytest]
testpaths = tests
# The suite is simulation-heavy and embarrassingly parallel (every test is independent
# and self-seeds its RNG), so run across all cores by default via pytest-xdist. Disable
# with `-n0` for a serial run (e.g. to use -s / a debugger).
addopts = -n auto
markers =
    slow: long end-to-end simulation / calibration test (deselect with -m "not slow")
